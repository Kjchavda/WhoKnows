services:
  redis:
    image: redis:7-alpine
    container_name: whoknows-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - whoknows-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whoknows-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - whoknows-network

volumes:
  redis_data:

networks:
  whoknows-network:
    driver: bridge

